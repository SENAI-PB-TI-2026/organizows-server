# Configuração de DataSource - Perfil Dev
# Suporta injeção por variáveis de ambiente DEV_DB_* ou SPRING_DATASOURCE_*, com fallback para H2 dev
spring.datasource.url=${DEV_DB_URL:${SPRING_DATASOURCE_URL:jdbc:h2:mem:organizows_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.driver-class-name=${DEV_DB_DRIVER:${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}}
spring.datasource.username=${DEV_DB_USER:${SPRING_DATASOURCE_USERNAME:sa}}
spring.datasource.password=${DEV_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# H2 Console para inspeção durante desenvolvimento
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

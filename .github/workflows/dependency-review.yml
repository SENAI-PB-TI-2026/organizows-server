name: CI docente - dependencias
on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v4
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          # Forks e Dependabot recebem token somente leitura neste evento.
          comment-summary-in-pr: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]' && 'always' || 'never' }}

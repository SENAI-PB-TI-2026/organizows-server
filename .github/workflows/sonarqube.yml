name: CI docente - SonarQube
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sonar-docente-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sonar:
    name: SonarQube - analise informativa
    # Ativar somente depois de proteger o ambiente docente e cadastrar o projeto.
    if: >-
      vars.SONAR_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
      (vars.SONAR_PR_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository)) &&
      (github.event_name != 'workflow_dispatch' ||
      github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: sonar-docente
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Compilar sem testes
        run: bash mvnw --batch-mode --no-transfer-progress clean compile -Dmaven.test.skip=true
      - name: Publicar analise estatica
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SONAR_TOKEN" || -z "$SONAR_ORGANIZATION" || -z "$SONAR_PROJECT_KEY" ]]; then
            echo "::error::Configure o ambiente sonar-docente antes de ativar a analise."
            exit 1
          fi
          bash mvnw --batch-mode --no-transfer-progress \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
            -Dmaven.test.skip=true \
            -Dsonar.host.url=https://sonarcloud.io \
            "-Dsonar.organization=$SONAR_ORGANIZATION" \
            "-Dsonar.projectKey=$SONAR_PROJECT_KEY" \
            "-Dsonar.java.jdkHome=$JAVA_HOME" \
            '-Dsonar.coverage.exclusions=**/*' \
            -Dsonar.qualitygate.wait=false
